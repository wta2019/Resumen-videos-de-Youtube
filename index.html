    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoMind AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #f8fafc;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Print Styles for PDF Export */
      @media print {
        @page {
          margin: 20px;
          size: auto;
        }

        /* Reset global constraints */
        html, body {
          height: auto !important;
          overflow: visible !important;
          background-color: white !important;
        }

        /* Hide everything by default */
        body * {
          visibility: hidden;
        }

        /* Ensure the printable content and all its descendants are visible */
        #printable-content, 
        #printable-content * {
          visibility: visible;
        }

        /* Position the content to overlay everything else */
        #printable-content {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          background-color: white !important;
          color: black !important;
          /* Important: Remove height constraints so it flows across pages */
          height: auto !important; 
          overflow: visible !important;
          display: block !important;
        }

        /* Expand scrollable areas to show full content */
        #printable-content .overflow-y-auto, 
        #printable-content .custom-scrollbar {
          overflow: visible !important;
          height: auto !important;
          max-height: none !important;
          display: block !important;
        }

        /* Styling overrides for legibility on paper */
        #printable-content h2 {
          color: #000000 !important;
          font-size: 24px !important;
          margin-bottom: 20px;
          border-bottom: 2px solid #ddd;
          padding-bottom: 10px;
        }
        
        #printable-content h3 {
          color: #1a202c !important;
          margin-top: 20px;
          margin-bottom: 10px;
          font-size: 18px !important;
          font-weight: bold;
        }

        #printable-content p, 
        #printable-content li {
          color: #111 !important;
          font-size: 11pt !important;
          line-height: 1.6;
          margin-bottom: 10px;
        }

        /* Script specific styling */
        #printable-content .font-mono {
           font-family: 'Courier New', Courier, monospace !important;
           white-space: pre-wrap !important;
        }

        /* Remove background styling from containers */
        #printable-content .bg-slate-800\/30,
        #printable-content .bg-slate-900\/50,
        #printable-content .border-slate-700\/50 {
          background-color: transparent !important;
          border: none !important;
          padding: 0 !important;
        }

        /* Hide UI elements marked with print:hidden */
        .print\:hidden {
          display: none !important;
        }
      }
    </style>
